# The intended install: one command, one container, one volume.
#
#   docker compose up
#
# Client links must be HTTPS in anything but a local trial. The documented path is a
# reverse proxy (Caddy, nginx, Traefik) in front of this, rather than a certificate
# story invented here.
services:
  tickmark:
    build: .
    image: tickmark:dev
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      TICKMARK_DATA: /data/tickmark.db
      # Sending reminders is optional. Uncomment these and Tickmark sends the reminder
      # itself rather than drafting it for you to copy. `docs/mail.md` explains what to
      # point them at, and why a relay rather than sending directly.
      # TICKMARK_SMTP_URL: "smtp://user@example.com:password@relay.example:587"
      # TICKMARK_MAIL_FROM: "Tickmark Practice <office@practice.example>"
      #
      # If the relay's certificate comes from your own authority, the CA file has to be
      # inside the container as well as named here — add a bind mount for it beside the
      # volume below, and set TICKMARK_SMTP_CA_FILE to the path inside the container.
      # TICKMARK_SMTP_CA_FILE: "/etc/tickmark/my-relay-ca.pem"
    volumes:
      - tickmark-data:/data
    # /healthz touches the database, so "healthy" here means the process can serve and read its own
    # schema — not merely that the port is open.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  tickmark-data: